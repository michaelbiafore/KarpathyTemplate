[project]
name = "pdf2md-vendored"
version = "0.1.0+vendored.20260428"
description = "Vendored copy of PDF2MD4Claude for the ts-fms wiki — see README.md for upstream pin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "markdownify>=0.12.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"
pdf2md-summarize = "pdf2md.summarizer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]
