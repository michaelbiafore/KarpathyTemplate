[project]
name = "epub2md-vendored"
version = "0.1.1+vendored.20260428"
description = "Vendored copy of EPUB2MD4Claude for the ts-fms wiki — see README.md for upstream pin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.12.0",
]

[project.scripts]
epub2md = "epub2md.cli:main"
epub2md-summarize = "epub2md.summarizer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub2md"]
